name: docs

# Triggered when `rtp.js-npm-publish.yaml` finishes successfully
# (`workflow_run`). It builds the docs from the released commit and deploys them
# to GitHub Pages.
#
# It can also be triggered manually (`workflow_dispatch`) to re-deploy the docs
# (for example if the previous attempt failed).
on:
  workflow_run:
    workflows: ['rtp.js-npm-publish']
    # `workflow_run` only has 'requested', 'in_progress' and 'completed' activity
    # types (there is no 'success'/'failure' type). 'completed' fires once the
    # upstream run has fully finished, regardless of its conclusion. The actual
    # success is gated in the job's `if` below, via
    # `github.event.workflow_run.conclusion`.
    types: [completed]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying.
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    environment:
      name: github-pages
      url: ${{ steps.deployment_1.outputs.page_url || steps.deployment_2.outputs.page_url || steps.deployment_3.outputs.page_url }}

    runs-on: ubuntu-26.04

    steps:
      # On `workflow_run` the default checkout is the HEAD of the default branch,
      # not the released commit, so check out the commit the publish ran on.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: npm ci
        run: npm ci --foreground-scripts

      - name: npm run docs
        run: npm run docs

      - name: Upload docs
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/

      # NOTE: Remove the retries (keep a single `actions/deploy-pages` step with
      # `id: deployment` and set `environment.url` back to
      # `${{ steps.deployment.outputs.page_url }}`) once this is fixed:
      # https://github.com/actions/deploy-pages/issues/451
      #
      # `actions/deploy-pages` looks the artifact up right after
      # `actions/upload-pages-artifact` finalizes it, and the artifact listing
      # may not include it yet ("No artifacts named "github-pages" were found
      # for this workflow run"). The lag is usually a few seconds but has been
      # seen at ~46 seconds. Re-running the job does not help (it uploads a
      # second artifact and then fails with "Multiple artifacts named
      # "github-pages""), so retry the deploy step itself.
      - name: Deploy docs to GitHub Pages (attempt 1)
        id: deployment_1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deploy
        if: ${{ steps.deployment_1.outcome == 'failure' }}
        run: sleep 15

      - name: Deploy docs to GitHub Pages (attempt 2)
        id: deployment_2
        if: ${{ steps.deployment_1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying deploy
        if: ${{ steps.deployment_2.outcome == 'failure' }}
        run: sleep 45

      - name: Deploy docs to GitHub Pages (attempt 3)
        id: deployment_3
        if: ${{ steps.deployment_2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
